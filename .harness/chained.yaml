pipeline:
  clone:
    enabled: false
  timeout: 15m
  inputs:
    head_sha:
      type: string
      default: ''
    pr_number:
      type: string
      default: '0'
  stages:
  - id: trusted_preparation
    runtime: cloud
    clone:
      enabled: false
    cache:
      enabled: false
    steps:
    - id: download_fixed_asset
      run:
        shell: bash
        script: |
          set -eu
          python3 - <<'PY'
          import base64,hashlib,json,os,re,shlex,urllib.request
          from pathlib import Path
          sha=os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha), 'Exact commit SHA required'
          number=os.environ['PR_NUMBER']
          assert re.fullmatch(r'[0-9]+',number)
          assert os.environ['OSS_CI_CANARY'].startswith('synthetic-only-')
          def get(path):
              req=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+os.environ['OSS_CI_ASSETS_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          if number!='0':
              pr=get('repos/ansibleautomates/oss-ci-isolation-lab/pulls/'+number)
              assert pr['base']['repo']['id']==1366105248 and pr['base']['ref']=='main'
              assert pr['head']['sha']==sha, 'PR changed since trigger; use the new revision'
          else:
              assert get('repos/ansibleautomates/oss-ci-isolation-lab/commits/main')['sha']==sha
          response=get('repos/ansibleautomates/oss-ci-assets-private/contents/fixtures/pricing.json?ref=225af5ec76b70ae52a7b01567871b2c3e0fee8f3')
          download=base64.b64decode(response['content'])
          data=json.loads(download)
          assert set(data)=={'schema','currency','discount_percent','items'} and data['schema']==1
          assert data['currency']=='USD' and data['discount_percent']==10 and data['items']==[10,20]
          asset=json.dumps(data,sort_keys=True,separators=(',',':')).encode()
          machine=Path('/proc/sys/kernel/random/boot_id').read_text().strip()
          Path('/tmp/oss-ci-trusted-sentinel').write_text(machine)
          values={'ASSET_B64':base64.b64encode(asset).decode(),'ASSET_SHA256':hashlib.sha256(asset).hexdigest(),'PREP_MACHINE_ID':machine}
          Path('/tmp/oss-ci-prepared.env').write_text('\n'.join('export '+key+'='+shlex.quote(value) for key,value in values.items())+'\n')
          print(json.dumps({'private_asset_downloaded':True,'trusted_canary_resolved':True,'contributor_code_executed':False,'asset_sha256':values['ASSET_SHA256']}))
          PY
          . /tmp/oss-ci-prepared.env
        env:
          OSS_CI_CANARY: <+secrets.getValue("oss_ci_canary")>
          OSS_CI_ASSETS_TOKEN: <+secrets.getValue("oss_ci_assets_token")>
          EXPECTED_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        output:
        - name: ASSET_B64
        - name: ASSET_SHA256
        - name: PREP_MACHINE_ID
  - id: contributor_tests
    chain:
      uses: default/chef_oss_pov/oss_ci_untrusted
      ref: main
      with:
        inputs:
          head_sha: ${{ inputs.head_sha }}
          asset_b64: <+pipeline.stages.trusted_preparation.steps.download_fixed_asset.output.outputVariables.ASSET_B64>
          asset_sha256: <+pipeline.stages.trusted_preparation.steps.download_fixed_asset.output.outputVariables.ASSET_SHA256>
          prep_machine_id: <+pipeline.stages.trusted_preparation.steps.download_fixed_asset.output.outputVariables.PREP_MACHINE_ID>
  - id: trusted_reporting
    runtime: cloud
    clone:
      enabled: false
    cache:
      enabled: false
    steps:
    - id: post_commit_status
      run:
        shell: bash
        script: |
          set -eu
          python3 - <<'PY'
          import json,os,re,urllib.request
          sha=os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          status=os.environ['VALIDATION_STATUS']
          assert status in {'Success','SUCCEEDED','Succeeded','Failed','FAILED','Failure','Aborted','ABORTED','Expired','ERRORED','Errored','Skipped','SKIPPED'}, 'Unknown validation status: '+status
          success=status in {'Success','SUCCEEDED','Succeeded'}
          execution=os.environ['EXECUTION_ID']
          assert re.fullmatch(r'[A-Za-z0-9_-]+',execution)
          url='https://unifiedpipeline.harness.io/ng/account/MGY3MmJmM2ItNTY5Ny00Yj/all/orgs/default/projects/chef_oss_pov/pipelines/oss_ci_chained/deployments/'+execution+'/pipeline'
          payload={'state':'success' if success else 'failure','context':'harness/chained-isolation','description':'CI trust-boundary validation '+('passed' if success else 'failed'),'target_url':url}
          req=urllib.request.Request('https://api.github.com/repos/ansibleautomates/oss-ci-isolation-lab/statuses/'+sha,method='POST',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['OSS_CI_ASSETS_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
          assert result['state']==payload['state']
          print(json.dumps({'github_status_posted':result['state'],'context':result['context'],'commit':sha,'contributor_code_executed':False}))
          PY
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
          VALIDATION_STATUS: <+pipeline.stages.contributor_tests.status>
          EXECUTION_ID: <+pipeline.executionId>
          OSS_CI_ASSETS_TOKEN: <+secrets.getValue("oss_ci_assets_token")>
    if: <+Always>
